# Gradle project properties for OpenClip.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.nonFinalResIds=true
# AGP 9 ships built-in Kotlin support and registers its own `kotlin`
# extension. OpenClip keeps the external Kotlin Gradle Plugin so the
# language version stays explicit and testable (issue #22).
android.builtInKotlin=false
# The external Kotlin Gradle Plugin does not support AGP 9's new DSL yet
# (kotl.in/gradle/agp-new-dsl). This opt-out is the documented bridge and
# disappears in AGP 10 — migrating to built-in Kotlin is the follow-up.
android.newDsl=false
