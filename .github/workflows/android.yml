name: android
on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:
    paths: ["app/**", ".github/workflows/android.yml", "engine/**"]

permissions:
  contents: write

# A superseded push cancels its predecessor: no more 1h queue burn.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# NOTE: the instrumented emulator suite is intentionally NOT on GitHub —
# it is a LOCAL gate: `bash scripts/emutest.sh` (see AGENTS.md). This
# workflow validates every commit/PR: debug APK + test APK build and the
# frozen-JNI symbol contract.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK + instrumented test APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --build-cache
      - name: JNI symbols cross-check (built libraries)
        run: bash scripts/check_jni_symbols.sh
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: openclip-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build release APK (debug-signed, installable)
        run: ./gradlew :app:assembleRelease
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
