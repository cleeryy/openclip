name: android
on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:
    paths: ["app/**", ".github/workflows/android.yml", "engine/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: JNI symbols cross-check (built libraries)
        run: bash scripts/check_jni_symbols.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openclip-debug
          path: app/build/outputs/apk/debug/*.apk

  emulator:
    # Real-device equivalent gate: runs the instrumented conformance suite
    # on an x86_64 emulator (KVM on ubuntu-latest). Only on master pushes:
    # PRs from forks get no secrets/network images and would only flake.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          # Boots must be real: no force-green, no snapshot masking.
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb shell wm density 420
            # Boot gate: real readiness (single dash-safe line; the runner
            # script parser breaks on multi-line loops). Fails honestly.
            boot_deadline=$((SECONDS + 600)); until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && adb shell pm list packages >/dev/null 2>&1; do if [ $SECONDS -ge $boot_deadline ]; then echo "emulator system never became usable" && exit 1; fi; sleep 5; done
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
            # Retry is single-line-dash-safe: one tolerated retry, then real
            # failure. No force-green: two consecutive failures fail the job.
            ./gradlew :app:connectedDebugAndroidTest || (echo "connectedDebugAndroidTest failed — retrying once" && ./gradlew :app:connectedDebugAndroidTest)
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclip-instrumented-reports
          path: app/build/reports/androidTests/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK (debug-signed, installable)
        run: ./gradlew :app:assembleRelease
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
