name: android
on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  # Backfill the package registry for an already published tag, e.g.
  # release_tag=0.2.0-alpha. The release must already exist.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag without the leading v (e.g. 0.2.0-alpha)"
        required: true
  pull_request:
    paths: ["app/**", ".github/workflows/android.yml", "engine/**"]

permissions:
  contents: write

# A superseded push cancels its predecessor: no more 1h queue burn.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# NOTE: the instrumented emulator suite is intentionally NOT on GitHub —
# it is a LOCAL gate: `bash scripts/emutest.sh` (see AGENTS.md). This
# workflow validates every commit/PR: debug APK + test APK build and the
# frozen-JNI symbol contract.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK + instrumented test APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --build-cache
      # Issue #32 §1: the release variant must keep building for forks and
      # pull requests, where the signing secrets are absent — the Gradle
      # config then falls back to the debug key instead of failing.
      - name: Release build with signing fallback
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease -PciAbi=x86_64 --build-cache
          apk="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          tool="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$tool" verify --print-certs "$apk"
      - name: JNI symbols cross-check (built libraries)
        run: bash scripts/check_jni_symbols.sh
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: calque-apks
          # ABI splits (issue #2): the debug variant now emits
          # calque-<version>-{arm64-v8a,x86_64,universal}.apk instead of a
          # single app-debug.apk. Test APKs are never split.
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      # Issue #32 §1: decode the release keystore from the repository
      # secrets into $RUNNER_TEMP (never the workspace, never logged).
      # Missing secrets (fork, dry run) leave the variables unset and the
      # build falls back to debug signing instead of failing.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CALQUE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CALQUE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CALQUE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CALQUE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::warning title=Release signing skipped::CALQUE_KEYSTORE_BASE64 missing — falling back to debug signing."
            exit 0
          fi
          ks="$RUNNER_TEMP/calque.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ks"
          chmod 600 "$ks"
          {
            echo "CALQUE_KEYSTORE_FILE=$ks"
            echo "CALQUE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "CALQUE_KEY_ALIAS=${KEY_ALIAS:-calque}"
            echo "CALQUE_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
          echo "Release keystore decoded into \$RUNNER_TEMP (contents never logged)."
      - name: Build release APKs (release key, debug fallback)
        run: ./gradlew :app:assembleRelease
      # Fail loudly if a tag build silently shipped a debug-signed APK:
      # the whole point of issue #32 is that an installed alpha keeps
      # updating in place.
      - name: Verify release signature
        run: |
          set -euo pipefail
          apk="$(ls app/build/outputs/apk/release/*-universal.apk)"
          tool="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$tool" verify --print-certs "$apk" | tee /tmp/apksigner.txt
          if [ -z "${CALQUE_KEYSTORE_FILE:-}" ]; then
            echo "No keystore in this run: debug fallback accepted."
            exit 0
          fi
          fp="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/apksigner.txt | head -1)"
          norm="$(printf '%s' "$fp" | tr -d ':' | tr 'A-F' 'a-f')"
          expected=613809b314777147a8730d23162de36b438b2a2b47a1b0468530b8e186fa21f3
          if [ "$norm" != "$expected" ]; then
            echo "unexpected signer digest: $fp (expected the Calque release key)" >&2
            exit 1
          fi
      - name: Package artifacts (per-ABI + universal, sha256 each)
        # Gradle emits calque-<version>-<abi>.apk / -universal.apk (issue #2).
        # Release assets use the Calque brand: calque-<tag>.apk for the
        # universal build and calque-<tag>-<abi>.apk for the splits.
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 3 ]; then
            echo "expected 3 release APKs (arm64-v8a + x86_64 + universal), got ${#apks[@]}" >&2
            printf '  %s\n' "${apks[@]}" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            base="$(basename "$apk" .apk)"
            case "$base" in
              *-universal) asset="calque-${GITHUB_REF_NAME}.apk" ;;
              *-arm64-v8a) asset="calque-${GITHUB_REF_NAME}-arm64-v8a.apk" ;;
              *-x86_64)    asset="calque-${GITHUB_REF_NAME}-x86_64.apk" ;;
              *) echo "unexpected release artifact: $apk" >&2; exit 1 ;;
            esac
            cp "$apk" "$asset"
            sha256sum "$asset" > "$asset.sha256"
          done
          ls -l calque-*.apk calque-*.apk.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            calque-*.apk
            calque-*.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Tags like v0.1.0-alpha / -beta / -rc are marked prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/calque.jks"

  # GitHub Packages entry point: APKs cannot live in the npm/Maven/NuGet/
  # RubyGems registries, but the container registry stores arbitrary OCI
  # artifacts. One artifact per release, pullable with oras.
  package:
    # always() so a dispatched backfill still runs when publish is skipped
    # (the release already exists in that case).
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "value=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Download published APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "v${{ steps.tag.outputs.value }}" \
            --repo "${{ github.repository }}" \
            --pattern 'calque-*.apk' --pattern 'calque-*.apk.sha256'
      - uses: oras-project/setup-oras@v1
      - name: Push OCI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.value }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/calque"
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push "$IMAGE:$TAG" \
            --artifact-type application/vnd.openclip.release \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.version=$TAG" \
            calque-*.apk calque-*.apk.sha256
          oras manifest fetch "$IMAGE:$TAG" | head -c 400
