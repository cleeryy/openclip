name: android
on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  # Backfill the package registry for an already published tag, e.g.
  # release_tag=0.2.0-alpha. The release must already exist.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag without the leading v (e.g. 0.2.0-alpha)"
        required: true
  pull_request:
    paths: ["app/**", ".github/workflows/android.yml", "engine/**"]

permissions:
  contents: write

# A superseded push cancels its predecessor: no more 1h queue burn.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# NOTE: the instrumented emulator suite is intentionally NOT on GitHub —
# it is a LOCAL gate: `bash scripts/emutest.sh` (see AGENTS.md). This
# workflow validates every commit/PR: debug APK + test APK build and the
# frozen-JNI symbol contract.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK + instrumented test APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --build-cache
      - name: JNI symbols cross-check (built libraries)
        run: bash scripts/check_jni_symbols.sh
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: calque-apks
          # ABI splits (issue #2): the debug variant now emits
          # calque-<version>-{arm64-v8a,x86_64,universal}.apk instead of a
          # single app-debug.apk. Test APKs are never split.
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build release APKs (debug-signed, installable)
        run: ./gradlew :app:assembleRelease
      - name: Package artifacts (per-ABI + universal, sha256 each)
        # Gradle emits calque-<version>-<abi>.apk / -universal.apk (issue #2).
        # Release assets use the Calque brand: calque-<tag>.apk for the
        # universal build and calque-<tag>-<abi>.apk for the splits.
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 3 ]; then
            echo "expected 3 release APKs (arm64-v8a + x86_64 + universal), got ${#apks[@]}" >&2
            printf '  %s\n' "${apks[@]}" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            base="$(basename "$apk" .apk)"
            case "$base" in
              *-universal) asset="calque-${GITHUB_REF_NAME}.apk" ;;
              *-arm64-v8a) asset="calque-${GITHUB_REF_NAME}-arm64-v8a.apk" ;;
              *-x86_64)    asset="calque-${GITHUB_REF_NAME}-x86_64.apk" ;;
              *) echo "unexpected release artifact: $apk" >&2; exit 1 ;;
            esac
            cp "$apk" "$asset"
            sha256sum "$asset" > "$asset.sha256"
          done
          ls -l calque-*.apk calque-*.apk.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            calque-*.apk
            calque-*.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Tags like v0.1.0-alpha / -beta / -rc are marked prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # GitHub Packages entry point: APKs cannot live in the npm/Maven/NuGet/
  # RubyGems registries, but the container registry stores arbitrary OCI
  # artifacts. One artifact per release, pullable with oras.
  package:
    # always() so a dispatched backfill still runs when publish is skipped
    # (the release already exists in that case).
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "value=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Download published APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "v${{ steps.tag.outputs.value }}" \
            --repo "${{ github.repository }}" \
            --pattern 'calque-*.apk' --pattern 'calque-*.apk.sha256'
      - uses: oras-project/setup-oras@v1
      - name: Push OCI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.value }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/calque"
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push "$IMAGE:$TAG" \
            --artifact-type application/vnd.openclip.release \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.version=$TAG" \
            calque-*.apk calque-*.apk.sha256
          oras manifest fetch "$IMAGE:$TAG" | head -c 400
